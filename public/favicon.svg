<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="timelink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#timelink-grad)"/>
  <!-- Outer Bezel Ring -->
  <circle cx="50" cy="50" r="34" stroke="url(#gold-grad)" stroke-width="4" fill="#0f172a" stroke-dasharray="1 3"/>
  <!-- Dial Inner Ring -->
  <circle cx="50" cy="50" r="28" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Watch Hands (10:10 classic luxury position) -->
  <line x1="50" y1="50" x2="35" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Second hand / Accent dot -->
  <line x1="50" y1="50" x2="50" y2="68" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3.5" fill="#fbbf24"/>
  <!-- Top / Bottom Lugs -->
  <rect x="40" y="8" width="20" height="8" rx="2" fill="#1e293b"/>
  <rect x="40" y="84" width="20" height="8" rx="2" fill="#1e293b"/>
</svg>
